# Runs on every push and pull request. Tests use the mock provider and throwaway databases only:
# no real credentials exist in CI.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24"

jobs:
  test:
    name: Types, unit, integration, security (with coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: otplease, POSTGRES_PASSWORD: otplease, POSTGRES_DB: otplease_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U otplease" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      - name: Create the test environment (random secrets, mock provider)
        run: node scripts/ci/make-test-env.mjs
      - run: npx prisma generate --schema apps/server/prisma/schema.prisma
      - run: npm run typecheck
      - run: npx prisma migrate deploy --schema apps/server/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://otplease:otplease@localhost:5432/otplease_test
      - name: Tests with coverage floor (90% lines, 80% branches)
        run: npm run test:coverage

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: otplease, POSTGRES_PASSWORD: otplease, POSTGRES_DB: otplease_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U otplease" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      - run: node scripts/ci/make-test-env.mjs
      - run: npx prisma generate --schema apps/server/prisma/schema.prisma
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          PW_CHANNEL: chromium
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            tests/e2e/report
            tests/e2e/results
            tests/e2e/.logs
          retention-days: 7

  security:
    name: Dependency audit and secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci --ignore-scripts
      # Fails on critical issues in what ships. High findings are printed and reviewed by a person: today the
      # only one is deepmerge-ts inside the Prisma CLI (a build/migrate-time tool; the fix is a Prisma major upgrade).
      - name: npm audit (production dependencies)
        run: |
          npm audit --omit=dev --audit-level=high || echo "::warning::npm audit reports high findings in production dependencies (see log)"
          npm audit --omit=dev --audit-level=critical
      - name: Scan the full history for committed secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Docker images build and the stack boots
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the full stack
        run: docker compose -f docker-compose.stack.yml up -d --build --wait --wait-timeout 300
      - name: Smoke test
        run: |
          curl -fsS http://localhost:4000/health
          curl -fsS -o /dev/null http://localhost:3002/
          curl -sS -o /dev/null -w '%{http_code}\n' http://localhost:3000/
      - name: Logs on failure
        if: failure()
        run: docker compose -f docker-compose.stack.yml logs --tail 100
      - if: always()
        run: docker compose -f docker-compose.stack.yml down -v
