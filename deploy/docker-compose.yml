# The staging/production stack on one server:  docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
# Only Nginx is reachable from outside (ports 80 and 443). Postgres and Redis are not published at all.
name: otplease-staging

x-backend-env: &backend-env
  NODE_ENV: production
  DEPLOY_ENV: ${DEPLOY_ENV:-staging}
  ALLOW_MOCK_PROVIDERS: ${ALLOW_MOCK_PROVIDERS:-false}
  DATABASE_URL: postgresql://otplease:${POSTGRES_PASSWORD}@postgres:5432/otplease
  REDIS_URL: redis://redis:6379/0
  OTP_HASH_SECRET: ${OTP_HASH_SECRET}
  JWT_SECRET: ${JWT_SECRET}
  ADMIN_TOKEN: ${ADMIN_TOKEN}
  # One proxy (Nginx) sits in front: trust exactly one hop, or every client would look like Nginx
  TRUST_PROXY: "1"
  LOG_LEVEL: ${LOG_LEVEL:-info}
  SENTRY_DSN: ${SENTRY_DSN:-}
  RELEASE: ${RELEASE:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  MAIL_FROM: ${MAIL_FROM:-OTPlease <no-reply@localhost>}
  TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
  TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
  TWILIO_SMS_FROM: ${TWILIO_SMS_FROM:-}
  TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-}
  TWILIO_VOICE_FROM: ${TWILIO_VOICE_FROM:-}
  TWILIO_WHATSAPP_CONTENT_SID: ${TWILIO_WHATSAPP_CONTENT_SID:-}
  TWILIO_STATUS_CALLBACK_URL: ${TWILIO_STATUS_CALLBACK_URL:-}

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment: { POSTGRES_USER: otplease, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}", POSTGRES_DB: otplease }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U otplease"], interval: 5s, retries: 20 }

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 20 }

  migrate:
    build: { context: .., dockerfile: docker/backend.Dockerfile }
    command: ["npx", "prisma", "migrate", "deploy", "--schema", "apps/server/prisma/schema.prisma"]
    environment: *backend-env
    depends_on: { postgres: { condition: service_healthy } }
    restart: "no"

  api:
    build: { context: .., dockerfile: docker/backend.Dockerfile }
    restart: unless-stopped
    environment: *backend-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      retries: 20

  worker:
    build: { context: .., dockerfile: docker/backend.Dockerfile }
    restart: unless-stopped
    command: ["node", "apps/worker/dist/index.js"]
    environment: *backend-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  dashboard:
    build: { context: .., dockerfile: docker/web.Dockerfile, args: { APP: web } }
    restart: unless-stopped
    environment: { API_URL: "http://api:4000", PORT: "3000" }
    depends_on: { api: { condition: service_healthy } }

  demo:
    build: { context: .., dockerfile: docker/web.Dockerfile, args: { APP: demo } }
    restart: unless-stopped
    environment:
      OTPLEASE_URL: http://api:4000
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      PORT: "3002"
    volumes: [demodata:/data]
    depends_on: { api: { condition: service_healthy } }

  nginx:
    image: nginx:1.27
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment: { DOMAIN: "${DOMAIN}" }
    volumes:
      - ./nginx/staging.conf.template:/etc/nginx/templates/default.conf.template:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on: { api: { condition: service_healthy } }

volumes:
  pgdata:
  redisdata:
  demodata:
