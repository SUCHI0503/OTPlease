services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: otplease
      POSTGRES_PASSWORD: otplease
      POSTGRES_DB: otplease
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "6379:6379"

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
